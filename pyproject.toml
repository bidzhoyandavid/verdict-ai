[project]
name = "verdict-ai"
version = "0.1.0"
description = "AI-агент для анализа A/B тестов поверх пакета abex"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "plotly>=5.24",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "abex @ file:///D:/Startups/abex/dist/abex-0.1.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "langgraph-checkpoint-postgres>=2.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9",
    "bcrypt>=4.1",
    "email-validator>=2.2",
]

[tool.setuptools]
packages = ["app", "app.nodes", "api", "api.routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
